name: Passo 4

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - .github/prompts/tag-autocomplete.prompt.md
      - workshop/prompt-rubric.md
      - workshop/implementation-plan.md

permissions:
  contents: read
  actions: write
  issues: write

env:
  STEP_5_FILE: .github/steps/5-step.md

jobs:
  find_exercise:
    name: Encontrar issue do exercício
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.3

  check_step_work:
    name: Verificar trabalho do passo
    needs: [find_exercise]
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}
      ISSUE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Encontrar último comentário
        id: find-last-comment
        uses: peter-evans/find-comment@v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          direction: last

      - name: Informar verificação
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: .github/translations/checking-work.md
          edit-mode: replace

      - name: Validar prompt, rubrica e plano
        id: validate
        continue-on-error: true
        run: node scripts/validate-step.mjs 4

      - name: Publicar resultado
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          edit-mode: replace
          file: .github/translations/step-results-table.md
          vars: |
            step_number: 4
            results_table:
              - description: "Prompt refinado, rubrica concluída e plano aprovado"
                passed: ${{ steps.validate.outcome == 'success' }}
            tips:
              - "Remova PREENCHA dos três artefatos e aprove explicitamente o plano."

      - name: Falhar quando a validação não passar
        if: ${{ steps.validate.outcome == 'failure' }}
        run: exit 1

  post_next_step_content:
    name: Publicar próximo passo
    needs: [find_exercise, check_step_work]
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}
      ISSUE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Informar conclusão
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: .github/translations/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 5

      - name: Publicar conteúdo do passo 5
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_5_FILE }}

      - name: Publicar acompanhamento
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: .github/translations/watching-for-progress.md

      - name: Avançar workflow
        run: |
          gh workflow disable "${{ github.workflow }}"
          gh workflow enable "Passo 5"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
