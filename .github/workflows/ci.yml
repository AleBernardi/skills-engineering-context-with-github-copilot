name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  starter:
    name: Validar starter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Instalar dependências
        run: npm ci

      - name: Testes baseline
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
