name: Passo 6

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  actions: write
  issues: write

env:
  REVIEW_FILE: .github/steps/x-review.md

jobs:
  find_exercise:
    name: Encontrar issue do exercício
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.3

  check_step_work:
    name: Verificar entrega final
    needs: [find_exercise]
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}
      ISSUE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Instalar dependências
        run: npm ci

      - name: Encontrar último comentário
        id: find-last-comment
        uses: peter-evans/find-comment@v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          direction: last

      - name: Informar verificação
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: .github/translations/checking-work.md
          edit-mode: replace

      - name: Validar revisão humana
        id: validate
        continue-on-error: true
        run: node scripts/validate-step.mjs 6

      - name: Confirmar contrato de solução preservado
        id: solution-contract
        continue-on-error: true
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git diff --exit-code origin/main -- tests/solution/

      - name: Executar contratos da aplicação
        id: app-checks
        continue-on-error: true
        run: |
          npm test
          npm run test:solution
          npm run lint
          npm run build

      - name: Publicar resultado
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          edit-mode: replace
          file: .github/translations/step-results-table.md
          vars: |
            step_number: 6
            results_table:
              - description: "Revisão humana aprovada com evidências"
                passed: ${{ steps.validate.outcome == 'success' }}
              - description: "Testes de contrato preservados"
                passed: ${{ steps.solution-contract.outcome == 'success' }}
              - description: "Testes, lint e build finais aprovados"
                passed: ${{ steps.app-checks.outcome == 'success' }}
            tips:
              - "Remova PREENCHA, preserve os testes de contrato e use Decisão: APPROVED."
              - "Se a comparação com main falhar, confirme que a branch main existe no repositório criado pelo template."

      - name: Falhar quando alguma validação não passar
        if: ${{ steps.validate.outcome == 'failure' || steps.solution-contract.outcome == 'failure' || steps.app-checks.outcome == 'failure' }}
        run: exit 1

  post_review_content:
    name: Publicar revisão do exercício
    needs: [find_exercise, check_step_work]
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}
      ISSUE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Informar conclusão
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: .github/translations/lesson-review.md

      - name: Publicar revisão
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.REVIEW_FILE }}
          vars: |
            full_repo_name: ${{ github.repository }}

      - name: Desabilitar workflow final
        run: gh workflow disable "${{ github.workflow }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finish_exercise:
    name: Finalizar exercício
    needs: [find_exercise, post_review_content]
    uses: skills/exercise-toolkit/.github/workflows/finish-exercise.yml@v0.9.3
    with:
      issue-url: ${{ needs.find_exercise.outputs.issue-url }}
      exercise-title: "GitHub Copilot Advanced - Contexto, Prompts e Modelos"
